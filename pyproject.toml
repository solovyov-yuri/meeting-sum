[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recap"
version = "0.2.0"
description = "Meeting transcription and summarization tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1,<2",
    "keyring>=25.0",
    # CUDA runtime wheels ship only for Linux/Windows; excluding macOS keeps `uv sync` from failing
    # there (DEP-003). whisper._set_cuda_paths() already guards each preload with `if exists()`, so a
    # CPU-only Linux/Windows box that never installs a GPU is fine too.
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9.24.0.43; sys_platform != 'darwin'",
    "openai>=2,<3",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12.0",
]

[project.scripts]
recap = "cli:app"
recap-bridge = "desktop_bridge:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.15"]
# Build-only, used by scripts/build-portable.ps1. Capped: the freeze is sensitive to PyInstaller's
# behaviour, and an unpinned latest would change the portable build with no repo change to bisect.
packaging = ["pyinstaller>=6,<7"]

[tool.hatch.build.targets.wheel]
sources = {"src" = ""}
include = [
    "/src/*.py",
    "/src/providers/*.py",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: end-to-end CLI flows (mocks only at provider-factory boundary)"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = false
